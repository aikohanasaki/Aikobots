<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Chat Comparison Tool</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 10px;
            background: #252525;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
            overflow: hidden;
        }
        .column-header {
            padding: 10px;
            background: #2d2d2d;
            border-bottom: 1px solid #333;
            font-weight: bold;
            text-align: center;
        }
        .viewport {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }
        .canvas {
            position: relative;
            width: 100%;
        }
        .item {
            position: absolute;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border-bottom: 1px solid #222;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
            overflow: hidden;
        }
        .diff {
            background-color: #3d2d2d;
        }
        .match {
            background-color: #2d3d2d;
        }
        .metadata {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>
    <header>
        <div id="chat-info">Comparison: <span id="chat-name"></span></div>
        <button id="close-btn">Close</button>
    </header>
    <div class="container">
        <div class="column">
            <div class="column-header">SQLite (Current)</div>
            <div id="sqlite-viewport" class="viewport">
                <div id="sqlite-canvas" class="canvas"></div>
            </div>
        </div>
        <div class="column">
            <div class="column-header">JSONL (Backup)</div>
            <div id="jsonl-viewport" class="viewport">
                <div id="jsonl-canvas" class="canvas"></div>
            </div>
        </div>
    </div>

    <script type="module">
        const params = new URLSearchParams(window.location.search);
        const avatarUrl = params.get('avatar_url');
        const fileName = params.get('file_name');
        const isGroup = params.get('is_group') === 'true';

        document.getElementById('chat-name').textContent = fileName;
        document.getElementById('close-btn').onclick = () => window.close();

        const ITEM_HEIGHT = 100;
        const PAGE_SIZE = 50;
        const PREFETCH_THRESHOLD = 0.3; // 30% from edge

        let sqliteData = {}; // Using object as map for sparse data
        let jsonlData = {};
        let totalItems = 0;
        let isLoading = false;

        async function fetchChunk(start) {
            if (isLoading) return;
            isLoading = true;
            try {
                const response = await fetch('/api/chats/compare', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ avatar_url: avatarUrl, file_name: fileName, is_group: isGroup, range_start: start, count: PAGE_SIZE })
                });
                const data = await response.json();

                // Assuming the first response gives us a hint about total items if we don't know it
                // For now, let's assume we fetch full size in metadata or just handle it dynamically
                // Actually, the compare endpoint returns everything if range_start is null.
                // Let's modify the initial load to get the total count.
                return data;
            } finally {
                isLoading = false;
            }
        }

        // Initial load to get total count
        const initialData = await fetchChunk(null);
        sqliteData = initialData.sqlite;
        jsonlData = initialData.jsonl_bak;
        totalItems = Math.max(sqliteData.length, jsonlData.length);

        const sqliteViewport = document.getElementById('sqlite-viewport');
        const jsonlViewport = document.getElementById('jsonl-viewport');
        const sqliteCanvas = document.getElementById('sqlite-canvas');
        const jsonlCanvas = document.getElementById('jsonl-canvas');

        sqliteCanvas.style.height = `${totalItems * ITEM_HEIGHT}px`;
        jsonlCanvas.style.height = `${totalItems * ITEM_HEIGHT}px`;

        function render() {
            const scrollTop = sqliteViewport.scrollTop;
            const viewportHeight = sqliteViewport.clientHeight;
            const startIdx = Math.floor(scrollTop / ITEM_HEIGHT);
            const endIdx = Math.min(totalItems - 1, Math.ceil((scrollTop + viewportHeight) / ITEM_HEIGHT));

            // Prefetch logic
            if (endIdx > totalItems * (1 - PREFETCH_THRESHOLD)) {
                // Already have all data in this implementation as fetchChunk(null) was used
                // but if we were chunking, we'd trigger next page here.
            }

            sqliteCanvas.innerHTML = '';
            jsonlCanvas.innerHTML = '';

            for (let i = startIdx; i <= endIdx; i++) {
                const sqliteItem = sqliteData[i];
                const jsonlItem = jsonlData[i];

                const sqliteEl = document.createElement('div');
                sqliteEl.className = 'item';
                sqliteEl.style.top = `${i * ITEM_HEIGHT}px`;
                sqliteEl.style.height = `${ITEM_HEIGHT}px`;
                sqliteEl.textContent = sqliteItem ? JSON.stringify(sqliteItem, null, 2) : '(empty)';

                const jsonlEl = document.createElement('div');
                jsonlEl.className = 'item';
                jsonlEl.style.top = `${i * ITEM_HEIGHT}px`;
                jsonlEl.style.height = `${ITEM_HEIGHT}px`;
                jsonlEl.textContent = jsonlItem ? JSON.stringify(jsonlItem, null, 2) : '(empty)';

                if (JSON.stringify(sqliteItem) !== JSON.stringify(jsonlItem)) {
                    sqliteEl.classList.add('diff');
                    jsonlEl.classList.add('diff');
                } else {
                    sqliteEl.classList.add('match');
                    jsonlEl.classList.add('match');
                }

                sqliteCanvas.appendChild(sqliteEl);
                jsonlCanvas.appendChild(jsonlEl);
            }
        }

        sqliteViewport.onscroll = () => {
            jsonlViewport.scrollTop = sqliteViewport.scrollTop;
            render();
        };
        jsonlViewport.onscroll = () => {
            sqliteViewport.scrollTop = jsonlViewport.scrollTop;
            render();
        };

        window.onresize = render;
        render();

    </script>
</body>
</html>
